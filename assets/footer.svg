<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <!-- 上方葱绿细线 -->
  <line x1="40" y1="15" x2="1160" y2="15" stroke="#39C5BB" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- 音符1: 八分音符 -->
  <g transform="translate(540, 35)" fill="#39C5BB" opacity="0.6">
    <ellipse cx="0" cy="12" rx="6" ry="4.5" transform="rotate(-20,0,12)" />
    <line x1="5" y1="10" x2="5" y2="-15" stroke="#39C5BB" stroke-width="2" />
    <path d="M 5,-15 Q 18,-10 14,-2" fill="#39C5BB" />
  </g>

  <!-- 音符2: 四分音符 -->
  <g transform="translate(600, 38)" fill="#39C5BB" opacity="0.5">
    <ellipse cx="0" cy="10" rx="5" ry="3.5" transform="rotate(-20,0,10)" />
    <line x1="4" y1="8" x2="4" y2="-12" stroke="#39C5BB" stroke-width="1.8" />
  </g>

  <!-- 音符3: 双八分 -->
  <g transform="translate(630, 36)" fill="#39C5BB" opacity="0.55">
    <ellipse cx="0" cy="12" rx="5" ry="3.5" transform="rotate(-20,0,12)" />
    <line x1="4" y1="10" x2="4" y2="-15" stroke="#39C5BB" stroke-width="2" />
    <ellipse cx="14" cy="8" rx="5" ry="3.5" transform="rotate(-20,14,8)" />
    <line x1="18" y1="6" x2="18" y2="-12" stroke="#39C5BB" stroke-width="2" />
    <line x1="4" y1="-12" x2="18" y2="-4" stroke="#39C5BB" stroke-width="1.8" />
  </g>

  <!-- 小花点缀 -->
  <circle cx="500" cy="38" r="6" fill="#FFB7C5" opacity="0.5" />
  <circle cx="500" cy="38" r="2.5" fill="#FFD1DC" opacity="0.8" />
  <circle cx="680" cy="38" r="6" fill="#FFB7C5" opacity="0.5" />
  <circle cx="680" cy="38" r="2.5" fill="#FFD1DC" opacity="0.8" />

  <!-- 底部字幕 -->
  <text x="600" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0">
    ✨ 初音未来主题 GitHub Profile · 模板项目 ✨
  </text>
</svg>
